# ============================================================================
# Servidor principal: optiobra.inferna.dev (Frontend Angular + API web)
# ============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name optiobra.inferna.dev;

    client_max_body_size 100M;

    # Frontend Angular (archivos estáticos)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Backend Django (mantenido como fallback del mismo dominio)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check para Pterodactyl
    location = /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================================
# API independiente: api-optiobra.inferna.dev (consumida por la app móvil)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api-optiobra.inferna.dev;

    client_max_body_size 100M;

    # Todo el tráfico se reenvía al backend Django
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
