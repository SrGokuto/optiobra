user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rutas escribibles (el filesystem raíz puede ser read-only en Pterodactyl)
    access_log /home/container/logs/nginx_access.log;
    error_log /home/container/logs/nginx_error.log;

    client_body_temp_path /tmp/nginx_temp/client_body;
    proxy_temp_path /tmp/nginx_temp/proxy;
    fastcgi_temp_path /tmp/nginx_temp/fastcgi;
    uwsgi_temp_path /tmp/nginx_temp/uwsgi;
    scgi_temp_path /tmp/nginx_temp/scgi;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}