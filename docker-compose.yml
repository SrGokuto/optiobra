version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: optiobra-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-optiobra}
      MYSQL_USER: ${DB_USER:-optiobra_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optiobra-backend
    restart: unless-stopped
    command: /bin/bash -c "cd /app/backend && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - ./backend:/app/backend:cached
      - backend_media:/app/backend/media
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${DB_NAME:-optiobra}
      DB_USER: ${DB_USER:-optiobra_user}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: mariadb
      DB_PORT: 3306
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:80
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Motor de inteligencia FastAPI (servicio en /intelligence). Ej: http://intelligence:8000
      INTELLIGENCE_URL: ${INTELLIGENCE_URL:-http://localhost:8000}
      INTELLIGENCE_TIMEOUT: ${INTELLIGENCE_TIMEOUT:-30}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(1); s.connect(('localhost', 8000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend/optiobra
      dockerfile: Dockerfile.dev
    container_name: optiobra-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/optiobra:/app:cached
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  mariadb_data:
  backend_media:
