services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/Qwen3-0.6B-Q4_K_M.gguf
      - --threads
      - "24"
      - --ctx-size
      - "4096"
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
    volumes:
      - ../models:/models
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  intelligence:
    build: .
    environment:
      - LLAMA_CPP_URL=http://llama-server:8080
      - MODEL_NAME=Qwen3-0.6B
      - CACHE_TTL=600
      - REQUEST_TIMEOUT=180
      - LOG_LEVEL=INFO
      - USE_MOCK=false
    ports:
      - "8001:8000"
    depends_on:
      llama-server:
        condition: service_healthy
    restart: unless-stopped
