<div class="dashboard">

  <app-sidebar [abierto]="menuAbierto" (toggle)="toggleMenu()"></app-sidebar>

  <button *ngIf="!menuAbierto"
          class="menu-fijo"
          (click)="toggleMenu()">
    <span class="material-symbols-outlined">menu</span>
  </button>

  <main class="contenido" [class.menu-cerrado]="!menuAbierto">

    <div class="header">

      <div>

        <h2>Configuración</h2>

        <p>

          Ajusta la configuración general del sistema

        </p>

      </div>

    </div>

    <div *ngIf="cargando" class="cargando">
      <p>Cargando configuración...</p>
    </div>

    <div *ngIf="error" class="error">
      <p>{{ error }}</p>
      <button (click)="cargarConfiguracion()">Reintentar</button>
    </div>

    <div *ngIf="!cargando && !error" class="configuracion">

      <aside class="menu-config">

        <button class="item activo">
          <i class="bi bi-sliders"></i>
          Información general
        </button>

        <button class="item">
          <i class="bi bi-building"></i>
          Perfil de empresa
        </button>

        <button class="item">
          <i class="bi bi-bell"></i>
          Notificaciones
        </button>

        <button class="item">
          <i class="bi bi-shield-lock"></i>
          Seguridad
        </button>

        <button class="item">
          <i class="bi bi-database"></i>
          Respaldo de datos
        </button>

      </aside>

      <section class="formulario">

        <h3>Información general</h3>

        <div class="grid">

          <div class="campo">
            <label>Nombre de la empresa</label>
            <input
              type="text"
              [(ngModel)]="empresa.nombre_empresa">
          </div>

          <div class="campo">
            <label>Correo electrónico</label>
            <input
              type="email"
              [(ngModel)]="empresa.email_contacto">
          </div>

          <div class="campo">
            <label>RUC</label>
            <input
              type="text"
              [(ngModel)]="empresa.nit_runc">
          </div>

          <div class="campo">
            <label>Teléfono</label>
            <input
              type="text"
              [(ngModel)]="empresa.telefono">
          </div>

          <div class="campo">
            <label>Dirección</label>
            <input
              type="text"
              [(ngModel)]="empresa.direccion">
          </div>

        </div>

        <div class="acciones">

          <button
            class="btn-guardar"
            (click)="guardarConfiguracion()"
            [disabled]="guardando">

            {{ guardando ? 'Guardando...' : 'Guardar cambios' }}

          </button>

        </div>

      </section>

    </div>

  </main>

</div>
