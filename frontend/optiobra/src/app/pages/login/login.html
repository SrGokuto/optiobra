<div class="login-container">
  <div class="left-panel">
    <div class="overlay"></div>
    <div class="content">
      <img src="assets/Logo.png" alt="Logo" class="icono-logo">

      <h1 class="nombre-logo">
        <span class="blanco">Opti</span><span class="amarillo">Obra</span>
      </h1>

      <p class="slogan">
        Datos que construyen
      </p>

      <div class="linea"></div>
    </div>

    <div class="line"></div>

  </div>


  <div class="right-panel">
    <div class="login-card">
      <h2>Bienvenido de nuevo</h2>
      <p class="subtitulo">
        Inicia sesión para continuar
      </p>

      <form (ngSubmit)="iniciarSesion()">

        <div class="input-group">
          <label>Correo electrónico</label>

          <input type="email" placeholder="ejemplo@correo.com" [(ngModel)]="correo" name="correo">
        </div>

        <div class="input-group">
          <label>Contraseña</label>

          <input type="password" placeholder="********" [(ngModel)]="password" name="password">
        </div>

        <a href="#" class="forgot">
          ¿Olvidaste tu contraseña?
        </a>

        <button type="submit">
          Iniciar sesión
        </button>

        <p class="register">
          ¿No tienes cuenta?
          <a href="#">Regístrate aquí</a>
        </p>

      </form>

    </div>

  </div>

</div>
