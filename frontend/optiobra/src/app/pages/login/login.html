<div class="login-container">
  <div class="left-panel">
    <div class="overlay"></div>
    <div class="content">
      <img src="assets/Logo.png" alt="Logo" class="icono-logo">

      <h1 class="nombre-logo">
        <span class="blanco">Opti</span><span class="amarillo">Obra</span>
      </h1>

      <p class="slogan">
        Datos que construyen
      </p>

      <div class="linea"></div>
    </div>

    <div class="line"></div>
  </div>

  <div class="right-panel">
    <div class="login-card">
      <h2>Bienvenido de nuevo</h2>
      <p class="subtitulo">
        Inicia sesión para continuar
      </p>

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            placeholder="ejemplo@correo.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            placeholder="********"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required>
        </div>

        @if (error) {
          <p class="error-message">{{ error }}</p>
        }

        <button type="submit" [disabled]="cargando">
          @if (!cargando) {
            <span>Iniciar sesión</span>
          } @else {
            <span>Iniciando...</span>
          }
        </button>

        <p class="register">
          ¿No tienes cuenta?
          <a routerLink="/register">Regístrate aquí</a>
        </p>
      </form>
    </div>
  </div>
</div>
