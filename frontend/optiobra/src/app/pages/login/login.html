<div class="login-container">
  <div class="left-panel">
    <div class="overlay"></div>
    <div class="content">
      <img src="assets/Logo.png" alt="Logo" class="icono-logo">

      <h1 class="nombre-logo">
        <span class="blanco">Opti</span><span class="amarillo">Obra</span>
      </h1>

      <p class="slogan">
        Datos que construyen
      </p>

      <div class="linea"></div>
    </div>

    <div class="line"></div>

  </div>

  
  <div class="right-panel">
    <div class="login-card">
      <h2>Bienvenido de nuevo</h2>
      <p class="subtitulo">
        Inicia sesión para continuar
      </p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            [class.is-invalid]="isInvalid('email')">

          @if (isInvalid('email')) {
            <span class="error-msg">{{ getErrorMessage('email') }}</span>
          }
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>

          <div class="input-wrapper">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              [class.is-invalid]="isInvalid('password')">

            <button
              type="button"
              class="eye-btn"
              (click)="togglePassword()">
              👁
            </button>
          </div>

          @if (isInvalid('password')) {
            <span class="error-msg">{{ getErrorMessage('password') }}</span>
          }
        </div>

        <a href="#" class="forgot">
          ¿Olvidaste tu contraseña?
        </a>

        <button
          type="submit"
          class="btn-login"
          [disabled]="isLoading">

          @if (!isLoading) {
            <span>Iniciar sesión</span>
          } @else {
            <span class="loading-spinner"></span>
          }

        </button>

        <p class="register">
          ¿No tienes cuenta?
          <a routerLink="/register" class="link">Regístrate aquí</a>
        </p>

      </form>

    </div>

  </div>

</div>
