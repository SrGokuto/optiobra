<div class="dashboard">

  <app-sidebar [abierto]="menuAbierto" (toggle)="toggleMenu()"></app-sidebar>

  <button *ngIf="!menuAbierto" class="menu-fijo" (click)="toggleMenu()">
    <span class="material-symbols-outlined">menu</span>
  </button>

  <main class="contenido" [class.menu-cerrado]="!menuAbierto">

    <div class="header">

      <div>

        <h2>Usuarios</h2>

        <p>Gestiona los usuarios del sistema</p>

      </div>

      <button class="btn-nuevo" (click)="crearUsuario()">

        + Nuevo usuario

      </button>

    </div>

    <div class="filtros">

      <input
        type="text"
        placeholder="Buscar usuarios..."
        [(ngModel)]="filtroBusqueda"
        (input)="onFiltroChange()">

      <select [(ngModel)]="filtroRol" (change)="onFiltroChange()">

        @for (rol of roles; track rol) {
          <option [value]="rol">{{ rol === 'Todos los roles' ? 'Todos los roles' : formatearRol(rol) }}</option>
        }

      </select>

    </div>

    <div *ngIf="cargando" class="cargando">
      <p>Cargando usuarios...</p>
    </div>

    <div *ngIf="error" class="error">
      <p>{{ error }}</p>
    </div>

    <div *ngIf="!cargando && !error" class="tabla-container">

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Nombre</th>
            <th>Correo electrónico</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let usuario of usuarios">

            <td>{{ usuario.id }}</td>

            <td>{{ usuario.nombre_completo }}</td>

            <td>{{ usuario.email }}</td>

            <td>{{ formatearRol(usuario.rol) }}</td>

            <td>

              <span

                class="estado"

                [class.activo]="usuario.activo"

                [class.inactivo]="!usuario.activo">

                {{ formatearEstado(usuario.activo) }}

              </span>

            </td>

            <td class="acciones">

              <button class="editar" (click)="editarUsuario(usuario)">

                Editar

              </button>

              <button class="eliminar" (click)="eliminarUsuario(usuario)">

                Eliminar

              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </main>

</div>
